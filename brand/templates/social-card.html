<!doctype html><html><head><meta charset="utf-8"><style>
:root{--ink:#16122e;--ink2:#2a2450;--y:#ffd23f;--v:#7c5cff;--vs:#b9a8ff;--w:#ff7a29}
*{box-sizing:border-box}
body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--ink);color:#fff;font-family:"Noto Sans","DejaVu Sans",system-ui,sans-serif;position:relative}
.bg{position:absolute;inset:0;background:
 radial-gradient(600px 400px at 80% 30%, rgb(124 92 255 / .35), transparent 70%),
 radial-gradient(500px 300px at 10% 110%, rgb(255 210 63 / .14), transparent 70%);}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgb(255 255 255 / .04) 1px,transparent 1px),linear-gradient(90deg,rgb(255 255 255 / .04) 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(90deg,transparent,#000 40%,#000)}
.left{position:absolute;left:60px;top:80px;width:520px}
.left svg{height:88px;width:auto;display:block}
h1{font-size:34px;line-height:1.1;margin:36px 0 16px;letter-spacing:-.01em;font-weight:800}
h1 em{font-style:normal;color:var(--y)}
p{font-size:19px;line-height:1.45;color:#c9c2ef;margin:0;max-width:500px}
.keys{display:flex;gap:10px;margin-top:30px}
.k{min-width:54px;height:54px;padding:0 14px;border-radius:12px;background:#221c45;border:1px solid #3b3370;box-shadow:0 4px 0 #0c0a1c;display:grid;place-items:center;font:700 24px "JetBrainsMono NF","DejaVu Sans Mono",monospace;color:var(--y)}
.k.l{color:#fff;font-size:18px}
.plus{align-self:center;color:#7d76a8;font:600 20px monospace}
.mock{position:absolute;right:40px;top:110px;width:520px;height:420px;border-radius:16px;background:#fbfaff;color:#1d1a33;box-shadow:0 30px 80px rgb(0 0 0 / .5);overflow:hidden}
.bar{height:40px;background:#ece9f7;display:flex;align-items:center;gap:8px;padding:0 14px}
.bar i{width:11px;height:11px;border-radius:50%;background:#cfc9e6}
.bar .url{margin-left:14px;height:22px;flex:1;border-radius:6px;background:#fff}
.page{padding:26px 30px;position:relative;height:380px}
.page h2{margin:0 0 6px;font-size:24px}
.page .t{height:10px;border-radius:5px;background:#e6e3f1;margin:10px 0}
.row{display:flex;gap:14px;margin-top:26px;align-items:center}
.btn{padding:11px 18px;border-radius:9px;font-weight:700;font-size:15px}
.btn.p{background:#2d6cdf;color:#fff}
.btn.s{background:#eef0f6;color:#333}
.fake{padding:11px 18px;border-radius:9px;background:#f3eaff;color:#5a3a9a;font-weight:700;font-size:15px}
.ring{position:absolute;border:3px solid var(--y);outline:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--ink),0 0 0 6px rgb(255 210 63 / .3);border-radius:8px}
.lab{position:absolute;display:flex;gap:7px;align-items:center;padding:5px 10px;border-radius:7px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;white-space:nowrap;box-shadow:0 6px 18px rgb(0 0 0 / .3)}
.lab .r{color:var(--y);font:700 12px monospace}
.warn{position:absolute;border:2px dashed var(--w);outline:1px solid var(--ink);border-radius:8px}
.lab.w{background:#2b1606;border:1px solid var(--w)}
.lab.w .r{color:var(--w)}
.toast{position:absolute;left:50%;bottom:24px;translate:-50% 0;padding:8px 16px;border-radius:999px;background:var(--ink);color:#fff;font-size:13px}
.toast b{font:700 12px monospace;color:var(--y);background:var(--ink2);padding:2px 6px;border-radius:4px}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<div class="left">
  {{WORDMARK}}
  <h1>Jump to any button.<br><em>See what a screen reader sees.</em></h1>
  <p>Keyboard quick nav for every page, driven by the accessibility tree, the same roles and names that VoiceOver and NVDA use.</p>
  <div class="keys"><div class="k">]</div><div class="plus">+</div><div class="k">b</div><div class="k">h</div><div class="k">l</div><div class="k">j</div><div class="k l">1–6</div></div>
</div>
<div class="mock">
  <div class="bar"><i></i><i></i><i></i><div class="url"></div></div>
  <div class="page">
    <h2>Checkout</h2>
    <div class="t" style="width:80%"></div><div class="t" style="width:62%"></div>
    <div class="row">
      <span class="btn s" id="b1">Back</span>
      <span class="fake" id="f1">Apply coupon</span>
      <span class="btn p" id="b2">Place order</span>
    </div>
    <div class="t" style="width:70%;margin-top:40px"></div><div class="t" style="width:50%"></div>
    <div class="toast"><b>]b</b> next button &nbsp;·&nbsp; <b>Enter</b> to focus</div>
  </div>
</div>
<script>
const page=document.querySelector('.page');
function at(id,cls,label,role,below){const e=document.getElementById(id);const pr=page.getBoundingClientRect(),r=e.getBoundingClientRect();
 const box=document.createElement('div');box.className=cls;Object.assign(box.style,{left:(r.left-pr.left-5)+'px',top:(r.top-pr.top-5)+'px',width:(r.width+10)+'px',height:(r.height+10)+'px'});page.append(box);
 const l=document.createElement('div');l.className='lab'+(cls==='warn'?' w':'');l.innerHTML='<span class="r">'+role+'</span>'+label;page.append(l);
 l.style.left=(r.left-pr.left-5)+'px';l.style.top=(below?(r.bottom-pr.top+12):(r.top-pr.top-l.offsetHeight-12))+'px';}
at('b2','ring','Place order','button');
at('f1','warn','Looks clickable, but has no button role','⚠ no role',true);
</script>
</body></html>
