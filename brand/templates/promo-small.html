<!doctype html><html><head><meta charset="utf-8"><style>
:root{--ink:#16122e;--y:#ffd23f;--v:#7c5cff}
body{margin:0;width:440px;height:280px;overflow:hidden;background:var(--ink);color:#fff;font-family:"Noto Sans","DejaVu Sans",sans-serif;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(260px 200px at 85% 20%,rgb(124 92 255 / .45),transparent 70%),radial-gradient(220px 160px at 0% 100%,rgb(255 210 63 / .16),transparent 70%)}
.c{position:absolute;left:34px;top:40px;right:34px}
.c svg{height:56px;width:auto;display:block}
h1{font-size:25px;line-height:1.2;margin:26px 0 0;font-weight:800}
h1 em{font-style:normal;color:var(--y)}
.keys{position:absolute;left:34px;bottom:30px;display:flex;gap:8px}
.k{min-width:38px;height:38px;padding:0 9px;box-sizing:border-box;border-radius:9px;background:#221c45;border:1px solid #3b3370;box-shadow:0 3px 0 #0c0a1c;display:grid;place-items:center;font:700 17px "JetBrainsMono NF","DejaVu Sans Mono",monospace;color:var(--y)}
</style></head><body><div class="bg"></div>
<div class="c">{{WORDMARK}}<h1>Keyboard quick nav,<br><em>powered by accessibility.</em></h1></div>
<div class="keys"><div class="k">]</div><div class="k">b</div><div class="k">[</div><div class="k">h</div><div class="k">\</div><div class="k">\</div></div>
</body></html>
