<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acme Outfitters — Checkout</title>
  <style>
    :root { --brand: #2d6cdf; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, "Noto Sans", sans-serif; color: #1d1a33; background: #fbfaff; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    header.site { display: flex; align-items: center; gap: 24px; padding: 14px 32px; background: #fff; border-bottom: 1px solid #e6e3f1; }
    header.site .logo { font-weight: 800; font-size: 20px; }
    header.site nav ul { display: flex; gap: 18px; list-style: none; margin: 0; padding: 0; }
    header.site nav a { color: #1d1a33; text-decoration: none; }
    .icon-btn { margin-left: auto; width: 38px; height: 38px; border-radius: 8px; border: 1px solid #ddd; background: #fff; display: grid; place-items: center; }
    main { max-width: 980px; margin: 0 auto; padding: 24px 32px 80px; display: grid; grid-template-columns: 1.4fr 1fr; gap: 32px; }
    h1 { margin: 0 0 4px; font-size: 30px; grid-column: 1 / -1; }
    .card { background: #fff; border: 1px solid #e6e3f1; border-radius: 14px; padding: 20px 22px; }
    label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 4px; }
    input[type=text], input[type=email], select, textarea { width: 100%; padding: 9px 11px; border: 1px solid #cfcbe0; border-radius: 8px; font: inherit; }
    .row { display: flex; gap: 12px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
    .btn { padding: 10px 18px; border-radius: 9px; font: 700 15px system-ui, sans-serif; border: 0; }
    .btn.primary { background: var(--brand); color: #fff; }
    .btn.secondary { background: #eef0f6; color: #333; }
    .fake-btn { padding: 10px 18px; border-radius: 9px; background: #f3eaff; color: #5a3a9a; font-weight: 700; cursor: pointer; display: inline-block; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    td, th { padding: 7px 4px; border-bottom: 1px solid #eee; text-align: left; }
    td.num { text-align: right; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 0; list-style: none; }
    .chips li { padding: 4px 10px; border-radius: 999px; background: #eef0f6; font-size: 13px; }
    iframe { width: 100%; height: 120px; border: 1px solid #e6e3f1; border-radius: 12px; }
    footer { padding: 24px 32px; color: #666; border-top: 1px solid #e6e3f1; }
    .product { display: flex; gap: 12px; align-items: center; }
    .product img { width: 56px; height: 56px; border-radius: 10px; background: #e9e4ff; }
  </style>
</head>
<body>
  <a class="sr-only" href="#main">Skip to content</a>
  <header class="site">
    <span class="logo">Acme Outfitters</span>
    <nav aria-label="Primary">
      <ul>
        <li><a href="#shop">Shop</a></li>
        <li><a href="#sale">Sale</a></li>
        <li><a href="#help">Help</a></li>
      </ul>
    </nav>
    <button class="icon-btn" id="cart"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M3 4h2l2 12h11l2-8H6" fill="none" stroke="#333" stroke-width="2"/></svg></button>
  </header>

  <main id="main">
    <h1>Checkout</h1>
    <section class="card" aria-labelledby="ship-h">
      <h2 id="ship-h">Shipping details</h2>
      <form aria-label="Shipping">
        <label for="name">Full name</label>
        <input id="name" type="text" autocomplete="name">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email">
        <label for="country">Country</label>
        <select id="country"><option>New Zealand</option><option>Australia</option></select>
        <label for="notes">Delivery notes</label>
        <textarea id="notes" rows="2"></textarea>
        <label><input type="checkbox" id="gift"> This is a gift</label>
        <fieldset style="border:0;padding:0;margin:12px 0 0">
          <legend style="font-weight:600;font-size:14px">Delivery speed</legend>
          <label style="display:inline;font-weight:400"><input type="radio" name="speed" checked> Standard</label>
          <label style="display:inline;font-weight:400;margin-left:12px"><input type="radio" name="speed"> Express</label>
        </fieldset>
        <div class="row">
          <button type="button" class="btn secondary" id="back">Back</button>
          <div class="fake-btn" id="coupon" onclick="this.textContent='Coupon applied'">Apply coupon</div>
          <button type="submit" class="btn primary" id="place">Place order</button>
        </div>
      </form>
    </section>

    <aside class="card" aria-labelledby="sum-h">
      <h2 id="sum-h">Order summary</h2>
      <div class="product"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" alt="Trail runner shoe, blue"><span>Trail runner ×1</span></div>
      <div class="product" style="margin-top:8px"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"><span>Socks ×2</span></div>
      <h4>Totals</h4>
      <table>
        <tr><th scope="row">Subtotal</th><td class="num">$148.00</td></tr>
        <tr><th scope="row">Shipping</th><td class="num">$0.00</td></tr>
        <tr><th scope="row">Total</th><td class="num"><strong>$148.00</strong></td></tr>
      </table>
      <h3>Tags</h3>
      <ul class="chips"><li>Free returns</li><li>Carbon neutral</li></ul>
      <acme-promo><span slot="cta">Join</span></acme-promo>
      <h3>Help</h3>
      <iframe id="help-frame" title="Help chat" srcdoc="<body style='font:15px system-ui;margin:12px'><h3 style='margin:0 0 8px'>Need help?</h3><button>Start chat</button> <a href='#faq'>Read the FAQ</a></body>"></iframe>
      <div aria-hidden="true"><button>Hidden from AT</button></div>
    </aside>
  </main>
  <footer><p>© Acme Outfitters · <a href="#privacy">Privacy</a></p></footer>

  <script>
    customElements.define("acme-promo", class extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: "open" }).innerHTML =
          '<div style="margin:16px 0;padding:12px 14px;border-radius:12px;background:#fff7d6"><strong>Members save 10%</strong> <button style="margin-left:8px"><slot name="cta"></slot></button></div>';
      }
    });
  </script>
</body>
</html>
